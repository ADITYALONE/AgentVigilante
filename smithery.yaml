# Smithery / Glama MCP registry stub for AgentVigilante
# Install (once published): npx -y @smithery/cli install agentvigilante --client claude

name: agentvigilante
version: "0.3.0"
description: Holographic containment runtime and kernel-tracing firewall for AI coding agents

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      agentVigilanteUrl:
        type: string
        default: "http://127.0.0.1:8420"
        description: Base URL of a running AgentVigilante control panel (agentvigilante start)
  commandFunction: |
    (config) => ({
      command: "python",
      args: ["-m", "agent_vigilante.mcp_server"],
      env: {
        AGENTVIGILANTE_URL: config.agentVigilanteUrl || "http://127.0.0.1:8420"
      }
    })
