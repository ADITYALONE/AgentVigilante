[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentvigilante"
version = "0.3.0"
description = "Local containment runtime and firewall for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Aditya Punjani" }]
license = { text = "MIT" }
keywords = ["mcp", "ai-agents", "sandbox", "docker", "security"]
dependencies = [
    "docker>=7.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
    "bashlex>=0.18",
    "mcp[cli]>=1.0.0",
]

[project.optional-dependencies]
dev = ["build", "twine"]

[project.scripts]
agentvigilante = "agent_vigilante.cli:main"

[project.urls]
Homepage = "https://github.com/ADITYALONE/AgentVigilante"
Documentation = "https://github.com/ADITYALONE/AgentVigilante#readme"

[tool.setuptools.packages.find]
include = ["agent_vigilante*"]

[tool.setuptools.package-data]
agent_vigilante = [
    "dashboard/templates/*.html",
]
